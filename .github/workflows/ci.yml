name: Validate production candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser -- --workers=3
      - run: npm run test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-browser-evidence
          path: |
            playwright-report/
            playwright-compat-report/
            test-results/
            docs/evidence/*.png
